# lefthook.yml

pre-commit:
  parallel: false
  jobs:
    - name: prettier
      run: ./node_modules/.bin/prettier --write --ignore-unknown -- {staged_files}
      glob: "*.{js,jsx,ts,tsx,cjs,mjs,json,md,css,yml,yaml}"
      stage_fixed: true

    # - name: eslint
    #   run: pnpm exec eslint --fix -- {staged_files}
